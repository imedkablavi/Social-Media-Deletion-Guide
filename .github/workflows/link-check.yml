name: Check external links

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Validate effective directory links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build effective URL list
        run: node scripts/export-effective-urls.js > effective-urls.txt

      # Some authenticated/provider endpoints intentionally reject non-browser bots.
      # Exclusions stay exact and narrow; public deletion/help URLs remain checked.
      # TikTok's two section pages below were browser-verified during final QA but
      # return a synthetic 404 specifically to Lychee's automated HTTP client.
      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 2
            --timeout 20
            --accept 200,204,206,301,302,303,307,308,401,403,405,429
            --exclude '^https://accounts\.snapchat\.com/'
            --exclude '^https://accounts\.nintendo\.com/'
            --exclude '^https://my\.telegram\.org/'
            --exclude '^https://discord\.com/settings/'
            --exclude '^https://x\.com/settings/'
            --exclude '^https://www\.instagram\.com/accounts/remove/'
            --exclude '^https://accountscenter\.instagram\.com/'
            --exclude '^https://www\.netflix\.com/account'
            --exclude '^https://www\.paypal\.com/myaccount/'
            --exclude '^https://www\.amazon\.com/hz/privacy-central/data-requests/preview\.html$'
            --exclude '^https://support\.tiktok\.com/en/privacy-safety/account-privacy-settings$'
            --exclude '^https://support\.tiktok\.com/en/safety-hc/account-and-user-safety$'
            --exclude '^https://myaccount\.ea\.com/'
            --exclude '^https://account\.battle\.net/'
            --exclude '^https://id\.atlassian\.com/'
            --exclude '^https://www\.figma\.com/settings'
            --exclude '^https://myprivacy\.uber\.com/'
            effective-urls.txt README.md index.html
          fail: true
          jobSummary: true
