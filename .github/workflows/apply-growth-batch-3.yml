name: Apply growth batch 3 source patch

on:
  push:
    branches: ["seo/growth-batch-3"]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run batch 3 source patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: seo/growth-batch-3
          fetch-depth: 0

      - name: Apply deterministic source migration
        run: node scripts/apply-growth-batch-3.js

      - name: Commit patched sources and remove one-time migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate growth batch 3 and verification hook"
          git push origin HEAD:seo/growth-batch-3
