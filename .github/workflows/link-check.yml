name: Resource freshness and reachability

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-audit:
    name: Classify resource freshness and reachability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build effective catalog and production pages
        run: npm run build

      - name: Audit provider resources
        env:
          AUDIT_DATE: ${{ github.event.repository.updated_at }}
        run: node scripts/audit-resources.js --online --output-dir=reports/resource-audit

      - name: Upload stale-resource and reachability report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resource-audit
          path: reports/resource-audit/
          if-no-files-found: error
