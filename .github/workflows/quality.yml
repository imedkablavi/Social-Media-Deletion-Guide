name: Quality checks

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit four-language localization
        run: node scripts/audit-localization.js

      - name: Build production site
        run: npm run build

      - name: Validate source, generated SEO pages and catalog
        run: python scripts/validate.py

      - name: Build effective user-visible URL list
        run: |
          node scripts/export-effective-urls.js > /tmp/effective-urls.txt
          test "$(wc -l < /tmp/effective-urls.txt)" -ge 100

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js scripts/*.js playwright.config.js tests/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
