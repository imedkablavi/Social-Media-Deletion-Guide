name: Apply README discovery patch

on:
  push:
    branches: ["seo/growth-batch-3"]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run README discovery patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: seo/growth-batch-3
          fetch-depth: 0
      - run: node scripts/apply-readme-discovery.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Expose search-focused guides in README"
          git push origin HEAD:seo/growth-batch-3
