name: Broken or outdated link
description: Report a deletion, export, privacy, security, or settings link that changed.
title: "[Link]: "
labels: ["broken-link"]
body:
  - type: input
    id: platform
    attributes:
      label: Platform or service
      placeholder: "Example: Instagram"
    validations:
      required: true

  - type: input
    id: current-url
    attributes:
      label: Current URL in the guide
      placeholder: "https://..."
    validations:
      required: true

  - type: dropdown
    id: issue
    attributes:
      label: What is wrong?
      options:
        - Link returns an error
        - Link redirects to an unrelated page
        - Instructions are outdated
        - The action is mislabeled
        - A better official link exists
        - Other
    validations:
      required: true

  - type: input
    id: replacement
    attributes:
      label: Replacement official URL (optional)
      placeholder: "https://official-service.example/..."

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Include country/region differences or sign-in requirements if relevant.
